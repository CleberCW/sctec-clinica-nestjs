name: OCI SSH Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ssh:
    name: Test SSH connection
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        env:
          OCI_VM_HOST: ${{ secrets.OCI_VM_HOST }}
          OCI_VM_USER: ${{ secrets.OCI_VM_USER }}
          OCI_VM_SSH_PRIVATE_KEY: ${{ secrets.OCI_VM_SSH_PRIVATE_KEY }}
          OCI_VM_KNOWN_HOSTS: ${{ secrets.OCI_VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${OCI_VM_HOST:?Missing OCI_VM_HOST}"
          : "${OCI_VM_USER:?Missing OCI_VM_USER}"
          : "${OCI_VM_SSH_PRIVATE_KEY:?Missing OCI_VM_SSH_PRIVATE_KEY}"
          : "${OCI_VM_KNOWN_HOSTS:?Missing OCI_VM_KNOWN_HOSTS}"

          install -m 700 -d ~/.ssh

          printf '%s\n' "$OCI_VM_SSH_PRIVATE_KEY" > ~/.ssh/oci_vm_key
          chmod 600 ~/.ssh/oci_vm_key

          printf '%s\n' "$OCI_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose host key
        shell: bash
        env:
          OCI_VM_HOST: ${{ secrets.OCI_VM_HOST }}
        run: |
          set -euo pipefail

          KNOWN_HOSTS="$HOME/.ssh/known_hosts"
          EXPECTED_HOST="163.176.159.8"

          echo "1. Checking configured host..."
          printf 'OCI_VM_HOST: <%s>\n' "$OCI_VM_HOST"

          echo
          echo "2. Checking known_hosts entries..."
          awk 'NF >= 3 {
            print "Host: " $1
            print "Key type: " $2
          }' "$KNOWN_HOSTS"

          echo
          echo "3. Checking expected IP..."

          if ssh-keygen -F "$EXPECTED_HOST" -f "$KNOWN_HOSTS"; then
            echo "SUCCESS: Expected IP found."
          else
            echo "ERROR: Expected IP NOT found."
          fi

          echo
          echo "4. Checking configured host..."

          if ssh-keygen -F "$OCI_VM_HOST" -f "$KNOWN_HOSTS"; then
            echo "SUCCESS: Configured host found."
          else
            echo "ERROR: Configured host NOT found."
            exit 1
          fi

      - name: Test SSH authentication
        env:
          OCI_VM_HOST: ${{ secrets.OCI_VM_HOST }}
          OCI_VM_USER: ${{ secrets.OCI_VM_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/oci_vm_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$OCI_VM_USER@$OCI_VM_HOST" \
            'echo "SSH authentication successful"; hostname'

name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: deploy-to-oracle-cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/clebercw/sctec-clinica-nestjs:${{ github.sha }}
            ghcr.io/clebercw/sctec-clinica-nestjs:latest

      - name: Configure SSH
        env:
          OCI_VM_SSH_PRIVATE_KEY: ${{ secrets.OCI_VM_SSH_PRIVATE_KEY }}
          OCI_VM_KNOWN_HOSTS: ${{ secrets.OCI_VM_KNOWN_HOSTS }}
          OCI_VM_HOST: ${{ secrets.OCI_VM_HOST }}
          OCI_VM_USER: ${{ secrets.OCI_VM_USER }}
        shell: bash
        run: |
          set -euo pipefail

          : "${OCI_VM_HOST:?Configure the OCI_VM_HOST GitHub Actions secret}"
          : "${OCI_VM_USER:?Configure the OCI_VM_USER GitHub Actions secret}"
          : "${OCI_VM_SSH_PRIVATE_KEY:?Configure the OCI_VM_SSH_PRIVATE_KEY GitHub Actions secret}"
          : "${OCI_VM_KNOWN_HOSTS:?Configure the OCI_VM_KNOWN_HOSTS GitHub Actions secret}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_VM_SSH_PRIVATE_KEY" > ~/.ssh/oci_vm_key
          chmod 600 ~/.ssh/oci_vm_key
          printf '%s\n' "$OCI_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "Checking SSH host key..."

          if ssh-keygen -F "$OCI_VM_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "SUCCESS: Host entry found in known_hosts"
          else
            echo "ERROR: No matching host entry for OCI_VM_HOST"
            exit 1
          fi

          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Deploy container on Oracle Cloud VM
        env:
          OCI_VM_HOST: ${{ secrets.OCI_VM_HOST }}
          OCI_VM_USER: ${{ secrets.OCI_VM_USER }}
          IMAGE: ghcr.io/clebercw/sctec-clinica-nestjs:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/oci_vm_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$OCI_VM_USER@$OCI_VM_HOST" \
            "bash -s -- '$IMAGE'" <<'REMOTE'
          set -Eeuo pipefail

          IMAGE="$1"
          CONTAINER_NAME="sctec-clinica-api"
          APP_DIR="$HOME/sctec-clinica"
          ENV_FILE="$APP_DIR/.env"

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed or is not available to this SSH user." >&2
            exit 1
          fi

          if [ ! -f "$ENV_FILE" ]; then
            echo "Runtime environment file not found: $ENV_FILE" >&2
            echo "Create it on the VM before deploying the application." >&2
            exit 1
          fi

          docker info >/dev/null

          OLD_IMAGE="$(docker inspect --format='{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)"

          # The GHCR package must be public so the VM can pull without credentials.
          docker pull "$IMAGE"

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          if docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p 3000:3000 \
            "$IMAGE"; then
            echo "Successfully deployed $IMAGE"
          else
            echo "New container failed to start. Attempting rollback." >&2
            if [ -n "$OLD_IMAGE" ]; then
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                --env-file "$ENV_FILE" \
                -p 3000:3000 \
                "$OLD_IMAGE" || true
            fi
            exit 1
          fi
          REMOTE

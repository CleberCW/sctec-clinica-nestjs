name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/clebercw/sctec-clinica-nestjs:${{ github.sha }}
            ghcr.io/clebercw/sctec-clinica-nestjs:latest

      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "GitHub secret RENDER_DEPLOY_HOOK_URL is not configured." >&2
            exit 1
          fi

          image="ghcr.io/clebercw/sctec-clinica-nestjs:${GITHUB_SHA}"
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=${image}" \
            "$RENDER_DEPLOY_HOOK_URL"

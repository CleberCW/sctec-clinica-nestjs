name: nestjs-clinica-db
services:
  postgres:
    image: postgres:18-alpine
    container_name: clinica-postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: clinica

    ports:
      - '5432:5432'

    volumes:
      - pgdata:/var/lib/postgresql/18/data

    #Para subir o container automaticamente após reiniciar o computador descomente abaixo
    #restart: unless-stopped

volumes:
  pgdata:
